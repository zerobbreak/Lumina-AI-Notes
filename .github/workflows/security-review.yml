# AI security reviewer for pull requests.
#
# Posts inline PR comments for vulnerabilities it finds in the diff (it reviews
# the changed lines, not the whole repo, so it stays fast and low-noise).
#
# SETUP (one time): add an Anthropic API key as a repository secret named
# ANTHROPIC_API_KEY under Settings -> Secrets and variables -> Actions.
# Until that secret exists the job skips itself instead of failing CI.
#
# This job is advisory: it never fails the build. Use codeql.yml (no key
# required) as the gating security check if you want one.

name: Security Review

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: security-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: claude-security-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Forked PRs get a read-only token with no secret access, so the review
    # cannot post comments there. Skip rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set - skipping the AI security review."
          fi

      - name: Claude security review
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          # Generated/vendored code produces noise, not findings.
          exclude-directories: node_modules,.next,out,public,convex/_generated
          claudecode-timeout: 20
          custom-security-scan-instructions: .github/security-review-instructions.md
