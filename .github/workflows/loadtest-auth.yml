name: Load test (production, signed in)

# 50 virtual users sign in through Clerk, then keep loading the dashboard.
# Read-only: no AI calls, no note writes. Needs the LOADTEST_ACCOUNTS secret:
# one "email,password" per line, for test accounts only.
on:
  push:
    branches: [loadtest]
    paths: [scripts/loadtest/auth-load.mjs, .github/workflows/loadtest-auth.yml]
  workflow_dispatch:

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LOADTEST_ACCOUNTS: ${{ secrets.LOADTEST_ACCOUNTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 50 signed-in users on the dashboard (normal pace, then stress)
        # "shell: bash" adds pipefail, so a failed test fails the job despite tee.
        shell: bash
        run: node scripts/loadtest/auth-load.mjs 50 120 60 | tee out.txt
      - name: Summary
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat out.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
